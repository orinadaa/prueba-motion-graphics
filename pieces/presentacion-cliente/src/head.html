<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  PRESENTACIÓN PARA EL CLIENTE — Sistema de citas, Clínica Veterinaria UDES. 16:9, 45s, 24fps, sin audio.
//  Un perrito con una placa ámbar en el collar se queda en su sitio mientras las pantallas reales cambian:
//  la placa salta a "lo siguiente que haces" (el ámbar de vetUI) y termina como el sello de cita confirmada.
//  Build: node <skill>/tools/build.mjs pieces/presentacion-cliente   ·   ?t=12.5 congela un fotograma
// =====================================================================
const FORMATS = { '16:9': [1920, 1080] };
const FORMAT = '16:9';
const FPS = 24, [W, H] = FORMATS[FORMAT];
const BPM = 120, GRID0 = 0, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 45.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 110, right: 60 };
const HAND = '"Raleway", "Segoe UI", Arial, sans-serif';
const CX = W / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);

// the scenes (seconds, on the 8th grid)
const S = { casa: 0, landing: 3.5, sedes: 8, agendar: 13, mascota: 15, fecha: 19, confirma: 24, campana: 28.5, citas: 32, mascotas: 37, cierre: 41, fin: DURATION };
const ERA_LIST = [
  [S.casa, S.landing, () => sceneCasa()],
  [S.landing, S.sedes, () => sceneLanding()],
  [S.sedes, S.agendar, () => sceneSedes()],
  [S.agendar, S.mascota, () => sceneAgendar()],
  [S.mascota, S.fecha, () => sceneMascota()],
  [S.fecha, S.confirma, () => sceneFecha()],
  [S.confirma, S.campana, () => sceneConfirma()],
  [S.campana, S.citas, () => sceneCampana()],
  [S.citas, S.mascotas, () => sceneCitas()],
  [S.mascotas, S.cierre, () => sceneMascotas()],
  [S.cierre, S.fin, () => sceneCierre()],
];
const SHOTS = [
  ['casa', 0, S.casa, S.landing, 'en casa: la mascota necesita una cita'],
  ['landing', 1, S.landing, S.sedes, 'el landing real; la placa salta a Agendar cita'],
  ['sedes', 2, S.sedes, S.agendar, 'servicios y las 2 sedes'],
  ['agendar', 3, S.agendar, S.mascota, 'clic en Agendar cita: los 5 pasos'],
  ['mascota', 4, S.mascota, S.fecha, 'paso 1-2: mascota y servicio'],
  ['fecha', 5, S.fecha, S.confirma, 'paso 3-4: sede, fecha y hora'],
  ['confirma', 6, S.confirma, S.campana, 'paso 5: confirmación y el sello ámbar'],
  ['campana', 7, S.campana, S.citas, 'notificaciones y recordatorio'],
  ['citas', 8, S.citas, S.mascotas, 'mis citas: reprogramar o cancelar'],
  ['mascotas', 9, S.mascotas, S.cierre, 'mis mascotas'],
  ['cierre', 10, S.cierre, S.fin, 'de vuelta en casa, feliz; logo UDES'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'F5',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [S.landing, S.sedes, S.agendar, S.mascota, S.fecha, S.confirma, S.campana, S.citas, S.mascotas, S.cierre],
  morphs: [],
  cues: { pregunta: 1.0, salto1: 6.0, clic1: 7.25, sello: 27.0 },
  anchor: { t0: S.mascota, t1: S.cierre },
  acts: [
    { name: '1 Casa', role: 'build', t0: S.casa, t1: S.landing },
    { name: '2 Web', role: 'journey', t0: S.landing, t1: S.agendar },
    { name: '3 Agendar', role: 'peak', t0: S.agendar, t1: 26.0 },
    { name: '4 Pausa', role: 'silence', t0: 26.0, t1: 27.0 },
    { name: '5 Confirmada', role: 'gift', t0: 27.0, t1: S.campana },
    { name: '6 Tu panel', role: 'journey', t0: S.campana, t1: S.cierre },
    { name: '7 Cierre', role: 'goodbye', t0: S.cierre, t1: S.fin },
  ],
  board: [
    { t: 2.2, title: '1 · En casa', sound: 'Luna, preocupada, se rasca; aparece el "?"', next: 'el "?" crece y se vuelve la ventana' },
    { t: 6.8, title: '2 · Landing', sound: 'la placa vuela al botón Agendar cita', next: 'la página baja a servicios' },
    { t: 11.4, title: '3 · Servicios y sedes', sound: 'Bucaramanga y Valledupar', next: 'clic en Agendar cita (barra)' },
    { t: 14.6, title: '4 · Agendar: 5 pasos', sound: 'el anillo recorre los 5 pasos', next: 'paso 1' },
    { t: 16.6, title: '5 · Mascota y servicio', sound: 'Luna seleccionada, luego Vacunación', next: 'Continuar' },
    { t: 22.6, title: '6 · Sede, fecha y hora', sound: 'Bucaramanga → 20 oct → 9:00', next: 'Confirmar cita' },
    { t: 27.6, title: '7 · Confirmación', sound: 'pausa de 1 s y el sello ámbar', next: 'la campana' },
    { t: 30.9, title: '8 · Notificaciones', sound: 'la campana suena; 24 h antes, también por correo', next: 'Mis citas' },
    { t: 35.9, title: '9 · Mis citas', sound: 'el detalle: reprogramar o cancelar', next: 'Mis mascotas' },
    { t: 39.6, title: '10 · Mis mascotas', sound: 'la foto real de Luna sale de su ficha', next: 'vuelta a casa' },
    { t: 44.0, title: '11 · Cierre', sound: 'Luna feliz en casa; logo UDES', next: 'vuelve al inicio' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;

const ERA_BG = ERA_LIST.map(() => '#06338A');
function pieceCam(era, t) { return null; }
